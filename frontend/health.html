<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0E7D8B" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <title>Bookkeeping — Health</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      .container {
        max-width: 640px;
        width: 100%;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 1.5rem;
        text-align: center;
      }
      .card {
        background: #1e293b;
        border-radius: 12px;
        padding: 1.5rem;
        margin-bottom: 1rem;
        border: 1px solid #334155;
      }
      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1rem;
      }
      .card-title {
        font-size: 1.1rem;
        font-weight: 600;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        font-size: 0.8rem;
        font-weight: 500;
      }
      .badge.ok {
        background: #064e3b;
        color: #34d399;
      }
      .badge.error {
        background: #7f1d1d;
        color: #f87171;
      }
      .badge.loading {
        background: #1e3a5f;
        color: #60a5fa;
      }
      .badge .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
      }
      .detail {
        display: flex;
        justify-content: space-between;
        padding: 0.5rem 0;
        border-top: 1px solid #334155;
        font-size: 0.9rem;
      }
      .detail-label {
        color: #94a3b8;
      }
      .detail-value {
        font-family: "SF Mono", "Fira Code", monospace;
        color: #e2e8f0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>System Health</h1>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Frontend</span>
          <span id="frontend-status" class="badge ok">
            <span class="dot"></span> Serving
          </span>
        </div>
        <div class="detail">
          <span class="detail-label">Commit</span>
          <span class="detail-value" id="frontend-commit">__GIT_COMMIT__</span>
        </div>
        <div class="detail">
          <span class="detail-label">Build Time</span>
          <span class="detail-value" id="frontend-build">__BUILD_TIME__</span>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Backend</span>
          <span id="backend-status" class="badge loading">
            <span class="dot"></span> Checking...
          </span>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Database</span>
          <span id="db-status" class="badge loading">
            <span class="dot"></span> Checking...
          </span>
        </div>
      </div>
    </div>

    <script>
      function setBadge(id, status, text) {
        var el = document.getElementById(id);
        el.className = "badge " + status;
        el.innerHTML = '<span class="dot"></span> ' + text;
      }

      // %VITE_API_URL% is replaced by Vite's HTML env replacement in dev and
      // build (the file is now a root HTML entry; /api is handled by the
      // dev proxy, and the production value comes from the VITE_API_URL env).
      // If the placeholder was never replaced (e.g. a dev clone without a
      // .env), fall back to /api so the health check still works.
      var API_BASE = "%VITE_API_URL%";
      if (!API_BASE || API_BASE.indexOf("%") !== -1) API_BASE = "/api";

      fetch(API_BASE + "/health")
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(function (data) {
          var backendOk = data.status === "ok";
          setBadge(
            "backend-status",
            backendOk ? "ok" : "error",
            backendOk ? "Healthy" : "Degraded"
          );
          setBadge(
            "db-status",
            backendOk ? "ok" : "error",
            backendOk ? "Connected" : "Error"
          );
        })
        .catch(function () {
          setBadge("backend-status", "error", "Unreachable");
          setBadge("db-status", "error", "Error");
        });
    </script>
  </body>
</html>
